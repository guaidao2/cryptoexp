name: publish

# Trusted Publishing: pushing a v* tag runs the tests, builds the distributions and
# uploads them to PyPI over OIDC. No API token is stored anywhere - PyPI trusts this
# repository, the workflow file name (`publish.yml`) and the `pypi` environment,
# which are the three fields registered on the PyPI side.
#
# Tag-only on purpose: a manual dispatch would try to publish the version already in
# pyproject.toml, and PyPI refuses a version that exists (it cannot be overwritten).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core is standard-library only, so there is nothing to install: the whole
      # suite (unit vectors + 19-sample challenge corpus + generated scripts) runs
      # against the checkout, with `src/` added to the path by the tests themselves.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  build:
    name: build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Guard against the classic release mistake: the tag says one thing and
      # pyproject.toml another, and PyPI then gets a version nobody expected.
      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python - <<'PY'
          import pathlib, tomllib
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(cfg["project"]["version"])
          PY
          )"
          echo "tag=$tag  pyproject=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match the version in pyproject.toml ($version)"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token PyPI exchanges for an upload grant
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # This action runs twine check itself, so metadata and README rendering are
      # validated before anything is uploaded.
      - uses: pypa/gh-action-pypi-publish@release/v1
