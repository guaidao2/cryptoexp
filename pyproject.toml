[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoexp"
version = "0.1.0a1"
description = "Crypto toolkit: dependency-free primitives, attack automation and analysis pipeline for CTF, security assessment and research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "coolmoon" },
  { name = "guaidao2" },
]
maintainers = [{ name = "coolmoon" }, { name = "guaidao2" }]
keywords = ["ctf", "cryptography", "security", "pentest", "rsa", "ecdsa", "lattice",
            "coppersmith", "oracle", "lfsr", "crc", "prng", "forensics", "jwt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/guaidao2/cryptoexp"
Repository = "https://github.com/guaidao2/cryptoexp"
Issues = "https://github.com/guaidao2/cryptoexp/issues"
Changelog = "https://github.com/guaidao2/cryptoexp/releases"

# The core is standard-library only. These are optional accelerators that the
# library auto-detects; nothing here is required to run cryptoexp.
[project.optional-dependencies]
fast = ["gmpy2"]
symbolic = ["sympy"]
aes = ["pycryptodome"]
solver = ["z3-solver"]
all = ["gmpy2", "sympy", "pycryptodome", "z3-solver"]

[project.scripts]
cryptoexp = "cryptoexp.cli:main"

# src layout: `import cryptoexp` must never silently pick up the repository copy
# instead of the installed package (that is the whole point of the layout).
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
